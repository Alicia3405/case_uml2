name: CI / Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  # --- Job 1: Verificación de Calidad y Compilación ---
  test:
    name: Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Backend Tests & Build
        working-directory: backend
        run: |
          npm ci || npm install
          npm test
          npm run build

      - name: Verify Frontend Tests & Production Build
        working-directory: web
        run: |
          npm ci || npm install --legacy-peer-deps
          npx ng test --watch=false
          npm run build -- --configuration=production

  # --- Job 2: Despliegue Directo a AWS EC2 vía SSH ---
  deploy:
    name: Deploy to AWS EC2
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "🚀 [AWS EC2] Iniciando despliegue de case_uml2..."

            export PATH=$PATH:/usr/bin:/usr/local/bin:/usr/local/bin/docker-compose

            # Asegurar permisos sobre el socket de Docker
            sudo chmod 666 /var/run/docker.sock || true

            # Navegar a la carpeta del proyecto case_uml2 o clonar
            if [ -d "$HOME/case_uml2" ]; then
              cd "$HOME/case_uml2"
            else
              git clone "https://github.com/${{ github.repository }}.git" "$HOME/case_uml2"
              cd "$HOME/case_uml2"
            fi

            # Sincronizar exactamente con origin/main conservando archivos .env no rastreados
            git fetch origin main
            git reset --hard origin/main

            # Desplegar servicios con Docker Compose en el servidor (proyecto case_uml2)
            if [ -d "infra" ]; then
              cd infra
              export DOMAIN_NAME="${{ secrets.DOMAIN_NAME }}"
              [ -z "$DOMAIN_NAME" ] && export DOMAIN_NAME="kellyuml.duckdns.org"
              if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
                export GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"
              fi

              sudo -E docker compose -p case_uml2 up -d --build --remove-orphans
              sudo -E docker compose -p case_uml2 restart nginx || true
              sudo -E docker compose -p case_uml2 ps
            fi

            echo "✅ [AWS EC2] Despliegue en producción completado con éxito!"
