name: CI / Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  # --- Job 1: Verificación de Calidad y Compilación ---
  test:
    name: Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Backend Tests & Build
        working-directory: backend
        run: |
          npm ci || npm install
          npm test
          npm run build

      - name: Verify Frontend Tests & Production Build
        working-directory: web
        run: |
          npm ci || npm install --legacy-peer-deps
          npx ng test --watch=false
          npm run build -- --configuration=production

  # --- Job 2: Despliegue Directo a AWS EC2 vía SSH ---
  deploy:
    name: Deploy to AWS EC2
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "🚀 [AWS EC2] Iniciando despliegue de case_uml2..."

            export PATH=$PATH:/usr/bin:/usr/local/bin:/usr/local/bin/docker-compose

            # Asegurar permisos sobre el socket de Docker
            sudo chmod 666 /var/run/docker.sock || true

            # Navegar a la carpeta del proyecto case_uml2 o clonar
            if [ -d "$HOME/case_uml2" ]; then
              cd "$HOME/case_uml2"
            else
              git clone "https://github.com/${{ github.repository }}.git" "$HOME/case_uml2"
              cd "$HOME/case_uml2"
            fi

            # Sincronizar exactamente con origin/main conservando archivos .env no rastreados
            git fetch origin main
            git reset --hard origin/main

            # Liberar caché Docker, imágenes huérfanas y logs antiguos para evitar ENOSPC (sin tocar volúmenes)
            echo "🧹 [AWS EC2] Espacio en disco antes de limpiar:"
            df -h /
            sudo docker container prune -f || true
            sudo docker builder prune -af || true
            sudo docker image prune -af || true
            sudo apt-get clean || true
            sudo journalctl --vacuum-time=2d || true
            sudo rm -rf /tmp/npm-* /home/ubuntu/.npm /root/.npm || true
            AVAIL_KB=$( (df -Pk /var/lib/docker 2>/dev/null || df -Pk /) | awk 'END {print $4}' )
            if [ "${AVAIL_KB:-0}" -lt 2097152 ]; then
              echo "⚠️ Espacio libre menor a 2 GB (${AVAIL_KB} KB); liberando imágenes anteriores de web/backend..."
              sudo docker compose -f "$HOME/case_uml2/infra/docker-compose.yml" -p case_uml2 stop web backend || true
              sudo docker compose -f "$HOME/case_uml2/infra/docker-compose.yml" -p case_uml2 rm -f web backend || true
              sudo docker image prune -af || true
            fi
            echo "🧹 [AWS EC2] Espacio en disco tras limpiar:"
            df -h /

            # Desplegar servicios con Docker Compose en el servidor (proyecto case_uml2)
            if [ -d "infra" ]; then
              cd infra
              export DOMAIN_NAME="${{ secrets.DOMAIN_NAME }}"
              [ -z "$DOMAIN_NAME" ] && export DOMAIN_NAME="kellyuml.duckdns.org"
              if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
                export GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"
              fi

              echo "🔨 [1/2] Construyendo frontend web..."
              sudo -E docker compose -p case_uml2 build web
              sudo docker builder prune -af || true

              echo "🔨 [2/2] Construyendo backend API..."
              sudo -E docker compose -p case_uml2 build backend
              sudo docker builder prune -af || true

              echo "🚀 Levantando servicios actualizados..."
              sudo -E docker compose -p case_uml2 up -d --remove-orphans
              sudo -E docker compose -p case_uml2 restart nginx || true
              sudo docker image prune -f || true
              sudo -E docker compose -p case_uml2 ps
              df -h /
            fi

            echo "✅ [AWS EC2] Despliegue en producción completado con éxito!"
