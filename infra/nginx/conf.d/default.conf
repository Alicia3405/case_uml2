# ==============================================================================
# Configuración Nginx con Terminación SSL / HTTPS (Let's Encrypt)
# Dominio: kellyuml.duckdns.org
# Proyecto: case_uml2
# ==============================================================================

# 1. Redirección HTTP a HTTPS
server {
    listen 80;
    server_name kellyuml.duckdns.org _;

    # Desafío de Certbot para renovación automática de SSL
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirección permanente a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Servidor HTTPS Seguro (Puerto 443)
server {
    listen 443 ssl http2;
    server_name kellyuml.duckdns.org;

    # Certificados SSL de Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/kellyuml.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kellyuml.duckdns.org/privkey.pem;

    # Protocolos y Ciphers recomendados
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Headers de seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # API REST del Backend
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        client_max_body_size 50M;
    }

    # Documentación Swagger / OpenAPI
    location /api/docs {
        proxy_pass http://backend:3000/api/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Swagger UI compatibilidad
    location /swagger-ui/ {
        proxy_pass http://backend:3000/api/docs/;
        proxy_set_header Host $host;
    }

    # WebSockets (Socket.IO para colaboración en tiempo real)
    location /socket.io/ {
        proxy_pass http://backend:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # WebSockets ws genérico
    location /ws {
        proxy_pass http://backend:3000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Frontend Web
    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
