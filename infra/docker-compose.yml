# ==============================================================================
# CASE Studio AI — Docker Compose (Producción AWS EC2 - Proyecto: case_uml2)
# Cuenta AWS: 886595575652
# Despliegue con MongoDB NoSQL (Integración completa de Alison)
# ==============================================================================
name: case_uml2

services:
  # --- MongoDB NoSQL Database ---
  mongodb:
    container_name: case_uml2_mongodb
    image: mongo:7-jammy
    restart: unless-stopped
    volumes:
      - case_uml2_mongodata:/data/db
    ports:
      - "127.0.0.1:27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - case_uml2_network

  # --- CASE Engine (NestJS / Mongoose Backend) ---
  backend:
    container_name: case_uml2_backend
    image: ${DOCKER_REGISTRY:-casestudio}/case_uml2-backend:${IMAGE_TAG:-latest}
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/case_studio_ai}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-case_studio_ai}
      JWT_SECRET: ${JWT_SECRET:-super_secret_case_studio_jwt_token_key_2026}
      CORS_ORIGINS: "*"
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "127.0.0.1:3002:3000"
    networks:
      - case_uml2_network

  # --- Web CASE Studio Frontend (Angular + Nginx) ---
  web:
    container_name: case_uml2_web
    image: ${DOCKER_REGISTRY:-casestudio}/case_uml2-web:${IMAGE_TAG:-latest}
    build:
      context: ../web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:80"
    networks:
      - case_uml2_network

  # --- Nginx Reverse Proxy + SSL ---
  nginx:
    container_name: case_uml2_nginx
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - backend
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - case_uml2_certbot_webroot:/var/www/certbot:ro
      - case_uml2_certbot_certs:/etc/letsencrypt:ro
    networks:
      - case_uml2_network

  # --- Certbot (SSL Let's Encrypt) ---
  certbot:
    container_name: case_uml2_certbot
    image: certbot/certbot
    volumes:
      - case_uml2_certbot_webroot:/var/www/certbot
      - case_uml2_certbot_certs:/etc/letsencrypt
    entrypoint: "true"
    networks:
      - case_uml2_network

volumes:
  case_uml2_mongodata:
  case_uml2_certbot_webroot:
  case_uml2_certbot_certs:

networks:
  case_uml2_network:
    name: case_uml2_network
